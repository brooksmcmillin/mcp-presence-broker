[project]
name = "mcp-presence-broker"
version = "0.1.0"
description = "A runnable reference for presence-gated, session-scoped MCP capabilities"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.30,<2",
    "pyotp>=2.9,<3",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "starlette>=1,<2",
]

[project.scripts]
presence-broker = "presence_broker.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presence_broker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
